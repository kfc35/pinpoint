[package]
name = "pinpoint"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
bevy = { version = "0.19.0", default-features = false, features = [
  # ui without default_platform
  "default_app",
  # TODO remove debug after we are done dev'ing.
  "debug",
  "ui_api",
  "ui_bevy_render",
  "scene",
  "picking",
  "bevy_ui_widgets",
  # default_platform without bevy_gilrs, multi_threaded
  "std",
  "bevy_winit",
  "bevy_clipboard",
  "default_font",
  "webgl2",
  "x11",
  "wayland",
  "custom_cursor",
  "sysinfo_plugin",
  # clipboard for ability to copy results
  "system_clipboard",
  # for persisting to local storage
  "bevy_settings",
  ] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "wasmbind"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
rand = { version = "0.10.2", default-features = false, features = ["thread_rng"] }
rand_pcg = { version = "0.10.2", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }
web-sys = { version = "0.3.104", default-features = false, features = [
  "Window",
  "Document",
] }
